set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -s extended-keys on

# Use the same physical prefix key on PC (`) and Mac (§).
set -g prefix '`'
set -g prefix2 '§'
unbind C-b
bind '`' send-prefix
bind '§' send-prefix -2

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys vi
set -g escape-time 10

# Theme
set -g status-position bottom
set -g status-style "bg=default,fg=colour8"
set -g status-left-length 40
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=colour3]#[bold]PREFIX  #[nobold],}#[fg=colour8]#{b:pane_current_path}  %H:%M "
set -g window-status-separator ""
set -g window-status-format " #[fg=colour8]#I:#W#F "
set -g window-status-current-format " #[fg=colour4,bold]#I:#W#F "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g message-style "bg=colour4,fg=colour15,bold"
set -g mode-style "bg=colour4,fg=colour15,bold"

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
