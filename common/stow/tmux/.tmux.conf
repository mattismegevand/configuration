set -as terminal-features ",xterm*:RGB:extkeys"
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -s extended-keys always
set -s extended-keys-format csi-u

# Use the same physical prefix key on PC (`) and Mac (§).
set -g prefix '`'
set -g prefix2 '§'
unbind C-b
bind '`' last-window
bind '§' last-window

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys vi
# Keep repeatable bindings active past the keyboard's initial repeat delay.
set -g repeat-time 1000

# Theme
set -g status-style "bg=default,fg=colour8"
set -g status-left-length 40
set -g status-left "#[fg=colour15,bold] #S #[default]"
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=colour3]#[bold]PREFIX  #[nobold],}#[fg=colour8]#{b:pane_current_path}  %H:%M "
set -g window-status-separator ""
set -g window-status-format " #[fg=colour8]#I:#W#F "
set -g window-status-current-format " #[fg=colour15,bold]#I:#W#F "
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour15"
set -g message-style "bg=colour15,fg=colour0,bold"
set -g mode-style "bg=colour15,fg=colour0,bold"

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Press the prefix once, then hold Shift+h/j/k/l to resize the active pane.
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
